apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: kafka-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-role
  namespace: kafka-dev
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
  namespace: kafka-dev
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: kafka-dev
roleRef:
  kind: Role
  name: flink-role
  apiGroup: rbac.authorization.k8s.io