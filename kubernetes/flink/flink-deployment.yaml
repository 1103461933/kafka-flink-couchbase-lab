apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata:
  name: event-processor
  namespace: kafka-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  image: xlen911/flink-job:v1.1.7
  flinkVersion: v1_19
  serviceAccount: flink
  podTemplate:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      containers:
        - name: flink-main-container
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-kafka-cluster-kafka-bootstrap.kafka-dev.svc.cluster.local:9092"
            - name: COUCHBASE_HOST
              value: "couchbase-svc.kafka-dev.svc.cluster.local"
            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: couchbase-credentials
                  key: username
            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchbase-credentials
                  key: password
  jobManager:
    resource:
      cpu: 0.5
      memory: "1024m"
  taskManager:
    resource:
      cpu: 0.5
      memory: "1024m"
    replicas: 1
  job:
    jarURI: local:///opt/flink/examples/streaming/StateMachineExample.jar
    parallelism: 1
    upgradeMode: stateless