apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment

metadata:
  name: event-processor
  namespace: kafka-dev
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  image: xlen911/flink-job:v1.1.14

  # IMPORTANTE:
  # Tu imagen aparentemente contiene Flink 1.20.
  # Verifica que sea compatible con el Operator antes de cambiar esto.
  flinkVersion: v1_19

  serviceAccount: flink

  podTemplate:
    metadata:
      labels:
        azure.workload.identity/use: "true"

    spec:
      containers:
        - name: flink-main-container
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "my-kafka-cluster-kafka-bootstrap.kafka-dev.svc.cluster.local:9092"

            - name: COUCHBASE_HOST
              value: "couchbase-svc.kafka-dev.svc.cluster.local"

            - name: COUCHBASE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: couchbase-credentials
                  key: username

            - name: COUCHBASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchbase-credentials
                  key: password

  jobManager:
    resource:
      cpu: 1
      memory: "2048m"

  taskManager:
    resource:
      cpu: 1
      memory: "2048m"
    replicas: 1

  job:
    jarURI: local:///opt/flink/usrlib/flink-job.jar
    parallelism: 3
    upgradeMode: stateless
    state: running

  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "3"

    # CORREGIDO: la URI debe tener esquema.
    execution.checkpointing.dir: "file:///opt/flink/data/checkpoints"
    execution.checkpointing.savepoint-dir: "file:///opt/flink/data/savepoints"

    execution.checkpointing.externalized-checkpoint-retention: "RETAIN_ON_CANCELLATION"

