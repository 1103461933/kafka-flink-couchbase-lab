apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: kafka-dev
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: xlen911/kafka-producer:v1.1.17
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080
              protocol: TCP

          env:
            - name: KAFKA_BROKERS
              value: "my-kafka-cluster-kafka-bootstrap.kafka-dev.svc.cluster.local:9092"  # 🔴 CORREGIDO: FQDN completo
            - name: KAFKA_TOPIC
              value: "events"
            - name: ENABLE_AUTO_EVENTS
              value: "false"

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20