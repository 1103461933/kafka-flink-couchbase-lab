apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: kafka-dev
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: xlen911/kafka-producer:v1.1.9
        command:
          - sh
          - -c
          - |
            while true; do
              echo '{"id":"'$(date +%s)'","type":"LOGIN","amount":100}' | bin/kafka-console-producer.sh --bootstrap-server my-kafka-cluster-kafka-bootstrap:9092 --topic events
              sleep 2
            done
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"