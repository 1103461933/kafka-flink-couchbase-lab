apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer
  namespace: kafka-dev
  labels:
    app: producer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
      - name: producer
        image: xlen911/kafka-producer:v1.0.0
        ports:
          - containerPort: 8080
        env:
          - name: KAFKA_BROKERS
            value: "my-kafka-cluster-kafka-brokers.kafka-dev.svc.cluster.local:9092"
          - name: KAFKA_TOPIC
            value: "events"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"
        readinessProbe:
          httpGet:
            path: /send-event
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /send-event
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10