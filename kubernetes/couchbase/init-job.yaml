apiVersion: batch/v1
kind: Job
metadata:
  name: couchbase-init
  namespace: kafka-dev
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: init
        image: couchbase/server:community-7.1.0
        env:
          - name: COUCHBASE_USERNAME
            valueFrom:
              secretKeyRef:
                name: couchbase-credentials
                key: username
          - name: COUCHBASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: couchbase-credentials
                key: password
        command:
        - sh
        - -c
        - |
          set -e

          USERNAME=$COUCHBASE_USERNAME
          PASSWORD=$COUCHBASE_PASSWORD
          HOST=couchbase-svc:8091

          echo "==> Esperando a que la API REST de Couchbase esté disponible..."
          for i in $(seq 1 60); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://$HOST/pools" || true)
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 401 ]; then
              echo "✅ Couchbase API is ready (HTTP $STATUS)"
              break
            fi
            echo "Waiting for Couchbase... attempt $i/60 (HTTP $STATUS)"
            sleep 5

            if [ $i -eq 60 ]; then
              echo "❌ Couchbase no está disponible después de 60 intentos"
              exit 1
            fi
          done

          echo "==> Verificando cluster..."
          if curl --silent -u "$USERNAME:$PASSWORD" "http://$HOST/pools/default" | grep -q '"isInitialized":true\|"nodes"'; then
            echo "✅ Cluster dynamic state: Already initialized"
          else
            echo "==> Inicializando cluster..."
            couchbase-cli cluster-init -c $HOST \
              --cluster-username=$USERNAME \
              --cluster-password=$PASSWORD \
              --cluster-name=my-cluster \
              --services=data,index,query,fts \
              --index-storage-setting=default \
              --cluster-ramsize=1024 \
              --cluster-index-ramsize=512
            echo "✅ Cluster initialized"
          fi

          echo "==> Verificando bucket 'events'..."
          if couchbase-cli bucket-list -c $HOST -u $USERNAME -p $PASSWORD 2>/dev/null | grep -q "events"; then
            echo "✅ Bucket 'events' already exists"
          else
            echo "==> Creando bucket 'events'..."
            couchbase-cli bucket-create -c $HOST \
              --username=$USERNAME \
              --password=$PASSWORD \
              --bucket=events \
              --bucket-type=couchbase \
              --bucket-ramsize=256 \
              --enable-flush=1
            echo "✅ Bucket 'events' created"
          fi

          echo "==> Verificando scope 'application'..."
          if curl --silent -u "$USERNAME:$PASSWORD" "http://$HOST/pools/default/buckets/events/scopes" 2>/dev/null | grep -q '"name":"application"'; then
            echo "✅ Scope 'application' already exists"
          else
            echo "==> Creando scope 'application'..."
            curl --silent -u "$USERNAME:$PASSWORD" \
              -X POST "http://$HOST/pools/default/buckets/events/scopes" \
              -d "name=application" > /dev/null
            echo "✅ Scope 'application' created"
          fi

          echo "==> Verificando colección 'processed-events'..."
          if curl --silent -u "$USERNAME:$PASSWORD" "http://$HOST/pools/default/buckets/events/scopes/application/collections" 2>/dev/null | grep -q '"name":"processed-events"'; then
            echo "✅ Colección 'processed-events' already exists"
          else
            echo "==> Creando colección 'processed-events'..."
            curl --silent -u "$USERNAME:$PASSWORD" \
              -X POST "http://$HOST/pools/default/buckets/events/scopes/application/collections" \
              -d "name=processed-events" > /dev/null
            echo "✅ Colección 'processed-events' created"
          fi

          echo "✅ Couchbase inicializado correctamente"