apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: events
  namespace: kafka-dev
  labels:
    strimzi.io/cluster: my-kafka-cluster
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 7200000
    segment.bytes: 1073741824
    cleanup.policy: delete