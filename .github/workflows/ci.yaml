name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test-producer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: producer/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./producer

      - name: Run lint
        run: npm run lint --if-present
        working-directory: ./producer
        continue-on-error: true

      - name: Run tests
        run: npm test --if-present
        working-directory: ./producer
        continue-on-error: true

  validate-flink:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven

      - name: Validate Maven project
        run: mvn validate
        working-directory: ./flink

  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeval
        run: |
          curl -sSL https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz | tar xz
          sudo mv kubeval /usr/local/bin/

      - name: Validate Kubernetes manifests
        run: |
          find kubernetes -name "*.yaml" -exec kubeval --strict {} \;

  validate-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for latest tag
        run: |
          echo "🔍 Verificando que no se use 'latest' en los manifiestos..."
          if grep -r "image:.*:latest" kubernetes/; then
            echo "❌ ERROR: Se encontró 'latest' en los manifiestos."
            exit 1
          fi
          echo "✅ No se encontró 'latest'."

      - name: Check for placeholder images
        run: |
          echo "🔍 Verificando placeholders de imágenes..."
          if grep -r "image: <dockerhub-user>/" kubernetes/; then
            echo "⚠️ WARNING: Placeholders encontrados. Reemplazar antes de desplegar."
          fi